<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>영수증모아 - 홈</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="./">영수증모아</a><nav class="main-nav" aria-label="기간별 보기"><a class="active" href="./">홈</a><a href="../day/">일</a><a href="../week/">주</a><a href="../month/">월</a><a href="../year/">년</a></nav><button id="logoutBtn" class="logout">로그아웃</button></header>
<main class="container">
<section class="hero"><div><p class="eyebrow">MY RECEIPTS</p><h1 id="welcomeMessage">안녕하세요!</h1><p id="userEmail" class="user-email"></p></div><button id="scanBtn" class="scan-btn">＋ 영수증 추가</button></section>
<section class="summary-grid"><article class="summary-card"><span>이번 달 지출</span><strong id="monthTotal">0원</strong></article><article class="summary-card"><span>저장된 영수증</span><strong id="receiptCount">0장</strong></article><article class="summary-card"><span>이번 달 영수증</span><strong id="monthCount">0장</strong></article></section>
<section class="content-card period-links"><div class="section-title"><div><p class="eyebrow blue-eyebrow">EXPENSE SUMMARY</p><h2>기간별로 모아보기</h2></div></div><div class="period-grid">
<a href="../day/" class="period-card"><span class="period-icon">D</span><div><strong>일별</strong><small>오늘의 지출 확인</small></div><span class="arrow">›</span></a><a href="../week/" class="period-card"><span class="period-icon">W</span><div><strong>주별</strong><small>이번 주 소비 흐름</small></div><span class="arrow">›</span></a><a href="../month/" class="period-card"><span class="period-icon">M</span><div><strong>월별</strong><small>이번 달 지출 분석</small></div><span class="arrow">›</span></a><a href="../year/" class="period-card"><span class="period-icon">Y</span><div><strong>연별</strong><small>올해 소비 흐름</small></div><span class="arrow">›</span></a>
</div></section>
<section class="toolbar"><div class="search-box"><span>⌕</span><input id="searchInput" placeholder="가게명, 상품명으로 검색"></div><select id="categoryFilter"><option value="all">전체 카테고리</option><option value="식비">식비</option><option value="카페">카페</option><option value="쇼핑">쇼핑</option><option value="교통">교통</option><option value="의료">의료</option><option value="기타">기타</option></select></section>
<section class="content-card"><div class="section-title"><div><p class="eyebrow blue-eyebrow">RECENT</p><h2>최근 영수증</h2></div><span class="live-badge">Firebase 동기화</span></div><div id="receiptList" class="receipt-list"></div></section>
</main>
<div id="scanModal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><h2>영수증 추가</h2><p>가게명과 금액을 입력하면 Firebase에 저장됩니다.</p><input id="storeInput" placeholder="가게명"><input id="amountInput" type="number" placeholder="금액"><select id="categoryInput"><option>식비</option><option>카페</option><option>쇼핑</option><option>교통</option><option>의료</option><option>기타</option></select><input id="itemInput" placeholder="상품명 (선택)"><button id="saveReceipt" class="primary">영수증 저장</button></div></div>
<script type="module" src="app.js"></script></body></html>
