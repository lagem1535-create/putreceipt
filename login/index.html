<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>영수증모아 - 로그인</title><link rel="stylesheet" href="style.css?v=6"></head><body><main class="login-card"><div class="logo">₩ 영수증모아</div><p class="subtitle">영수증을 찍으면 알아서 정리해드려요.</p><form id="loginForm"><label for="email">이메일</label><input id="email" type="email" placeholder="이메일을 입력하세요" autocomplete="email" required><label for="password">비밀번호</label><input id="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" minlength="6" required><button type="submit">로그인</button></form><div class="actions"><a class="secondary-link" href="../signup/">회원가입</a><button id="resetBtn" class="text-btn" type="button">비밀번호 재설정</button></div><p id="message" class="message"></p></main><script type="module" src="app.js?v=6"></script></body></html>
